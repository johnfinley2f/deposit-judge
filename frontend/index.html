<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DepositJudge — AI-Arbitrated Rental Deposit Disputes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,900;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
:root{
  --ink:#12181F;--ink-soft:#1B222B;--ink-line:#2A323E;
  --paper:#EDE7DA;--paper-dim:#DED5C0;
  --text-on-ink:#EDE9DD;--text-on-paper:#1C1A15;--muted:#6b6455;
  --seal:#7C5CBF;--seal-dim:#5b3fa8;
  --green:#2F8F5B;--green-bg:#e0efe5;
  --red:#B23A4E;--red-bg:#f4e2e5;
  --amber:#C98A2B;--amber-bg:#f6ecd8;
  --rose:#A65B72;--rose-bg:#f0e2e7;
  --blue:#3A7CA5;--blue-bg:#e1ecf2;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
.header{background:var(--ink-soft);border-bottom:1px solid var(--ink-line);}
.header-inner{max-width:760px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex-shrink:0;}
.brand-text{line-height:1.2;}
.brand-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a5;}
.brand-name{font-family:var(--serif);font-weight:700;font-size:20px;}
.wallet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.import-row{max-width:760px;margin:0 auto;padding:0 24px 16px;display:flex;gap:10px;flex-wrap:wrap;}
.import-row input{flex:1;min-width:200px;}
.addr{font-family:var(--mono);font-size:12px;color:#c8cede;background:#262b38;padding:6px 10px;border-radius:6px;word-break:break-all;display:inline-block;max-width:220px;text-align:left;}
.btn{font-family:var(--sans);font-weight:500;font-size:14px;padding:10px 18px;border-radius:6px;border:none;cursor:pointer;transition:opacity .15s ease,transform .1s ease;}
.btn:hover:not(:disabled){opacity:.88;}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--seal);color:#fff;}
.btn-secondary{background:#262b38;color:var(--text-on-ink);border:1px solid var(--ink-line);}
.btn-ghost{background:transparent;color:#9ba3b4;border:1px solid var(--ink-line);}
.btn-block{width:100%;}
.main{max-width:760px;margin:0 auto;padding:32px 24px 60px;}
.status-banner{border-radius:8px;padding:16px 20px;font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:24px;text-align:center;}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-rose{background:var(--rose-bg);color:var(--rose);}
.badge{background:#262b38;color:#9ba3b4;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink-line);overflow-x:auto;}
.tab{background:none;border:none;color:#8b93a5;font-family:var(--sans);font-size:13.5px;font-weight:500;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab-active{color:var(--text-on-ink);border-bottom-color:var(--seal);}
.panel{background:var(--paper);color:var(--text-on-paper);border-radius:0 0 10px 10px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.3);}
.panel h2{font-family:var(--serif);font-size:21px;margin:0 0 10px;}
.muted{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:20px;}
.field-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--paper-dim);gap:16px;}
.field-label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
.field-value{font-family:var(--mono);font-size:13px;text-align:right;word-break:break-word;}
.claim-block{margin-top:18px;padding:14px 16px;background:#fff;border-radius:6px;border:1px solid var(--paper-dim);}
.claim-block .who{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.claim-block .text{font-size:14px;line-height:1.55;}
textarea.input, input.input{width:100%;font-family:var(--sans);font-size:14px;padding:12px 14px;border:1px solid #d4cbb0;border-radius:6px;background:#fff;margin-bottom:14px;color:var(--text-on-paper);}
textarea.input{min-height:100px;resize:vertical;}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;}
.verdict-box{margin-top:24px;border:1px solid #d4cbb0;border-radius:8px;padding:22px 20px;background:#fffdf7;position:relative;}
.verdict-box::before{content:"◆";position:absolute;top:-12px;left:20px;background:var(--seal);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.verdict-split{font-family:var(--serif);font-weight:900;font-size:1.6rem;color:var(--seal);margin-bottom:6px;}
.verdict-amounts{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.verdict-label{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--seal);margin-bottom:8px;}
.verdict-text{font-size:15px;line-height:1.6;font-style:italic;font-family:var(--serif);font-weight:500;}
.alert{border-radius:6px;padding:12px 16px;font-size:12px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);line-height:1.5;}
.alert-error{background:var(--red-bg);color:var(--red);}
.footer{text-align:center;color:#5a6274;font-size:12px;padding:24px;font-family:var(--mono);}
.footer strong{color:var(--seal);}
.config-banner{background:#3a2f1a;color:#e8cf8a;font-size:12px;padding:10px 24px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const app = document.getElementById("app");

function showFatalError(title, err) {
  app.innerHTML = `
    <div style="max-width:640px;margin:60px auto;padding:24px;background:#2a1616;border:1px solid #5c2b2b;border-radius:8px;color:#f4c9c9;font-family:monospace;font-size:13px;line-height:1.6;">
      <div style="font-weight:bold;font-size:15px;margin-bottom:10px;">${title}</div>
      <div style="white-space:pre-wrap;word-break:break-word;">${(err && (err.stack || err.message || err)) || "Unknown error"}</div>
    </div>
  `;
}

let createClient, createGenLayerAccount, generatePrivateKey, studionet;

try {
  const core = await import("https://esm.sh/genlayer-js");
  createClient = core.createClient;
  createGenLayerAccount = core.createAccount;
  generatePrivateKey = core.generatePrivateKey;
} catch (err) {
  showFatalError("Failed to load genlayer-js core module from esm.sh", err);
  throw err;
}

try {
  const chains = await import("https://esm.sh/genlayer-js/chains");
  studionet = chains.studionet;
} catch (err) {
  showFatalError("Failed to load genlayer-js/chains module from esm.sh", err);
  throw err;
}

// ====== CONFIG ======
const CONTRACT_ADDRESS = "0xf445b8ecD30c1B0E5db2a63652fe4EB9ef7D5359";
// =====================

const STORAGE_KEY = "depositjudge_privkey";

function getStoredAccount() {
  const pk = localStorage.getItem(STORAGE_KEY);
  return pk ? createGenLayerAccount(pk) : null;
}
function createNewAccount() {
  const pk = generatePrivateKey();
  localStorage.setItem(STORAGE_KEY, pk);
  return createGenLayerAccount(pk);
}
function importAccount(pk) {
  const acc = createGenLayerAccount(pk); // throws if invalid
  localStorage.setItem(STORAGE_KEY, pk);
  return acc;
}
function clearAccount() {
  localStorage.removeItem(STORAGE_KEY);
}

class DepositJudgeContract {
  constructor(account) {
    this.client = createClient({ chain: studionet, ...(account ? { account } : {}) });
  }
  updateAccount(account) {
    this.client = createClient({ chain: studionet, ...(account ? { account } : {}) });
  }
  async getCaseSummary() {
    return await this.client.readContract({ address: CONTRACT_ADDRESS, functionName: "get_case_summary", args: [] });
  }
  async getVerdict() {
    return await this.client.readContract({ address: CONTRACT_ADDRESS, functionName: "get_verdict", args: [] });
  }
  async submitTenantClaim(text) {
    const hash = await this.client.writeContract({ address: CONTRACT_ADDRESS, functionName: "submit_tenant_claim", args: [text], value: 0 });
    return await this.client.waitForTransactionReceipt({ hash, status: "ACCEPTED", interval: 4000, retries: 60 });
  }
  async submitLandlordClaim(text) {
    const hash = await this.client.writeContract({ address: CONTRACT_ADDRESS, functionName: "submit_landlord_claim", args: [text], value: 0 });
    return await this.client.waitForTransactionReceipt({ hash, status: "ACCEPTED", interval: 4000, retries: 60 });
  }
  async resolveDispute() {
    const hash = await this.client.writeContract({ address: CONTRACT_ADDRESS, functionName: "resolve_dispute", args: [], value: 0 });
    return await this.client.waitForTransactionReceipt({ hash, status: "ACCEPTED", interval: 5000, retries: 120 });
  }
}

let account = getStoredAccount();
let contract = new DepositJudgeContract(account);
let state = { summary: null, verdict: null, loading: false, error: "", tab: "details", showImport: false };

const shortAddr = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "");
const badgeClass = (s) => ({ created: "badge-blue", tenant_submitted: "badge-amber", landlord_submitted: "badge-amber", resolved: "badge-green" }[s] || "badge");
const statusLabel = (s) => ({
  created: "Open — awaiting the tenant's statement",
  tenant_submitted: "Tenant statement filed — awaiting the landlord's statement",
  landlord_submitted: "Both statements filed — ready for a ruling",
  resolved: "Case resolved — ruling recorded on-chain",
}[s] || "Loading…");

async function refresh() {
  try {
    state.summary = await contract.getCaseSummary();
    if (state.summary.status === "resolved") {
      state.verdict = await contract.getVerdict();
    } else {
      state.verdict = null;
    }
    state.error = "";
  } catch (e) {
    state.error = "Could not load contract state.\n\nError: " + (e.name || "") + " " + (e.message || String(e)) + (e.stack ? ("\n\n" + e.stack.slice(0, 400)) : "");
  }
  render();
}

function connectWallet() { account = createNewAccount(); contract.updateAccount(account); state.showImport = false; render(); }
function toggleImport() { state.showImport = !state.showImport; render(); }
function handleImportWallet(pk) {
  try {
    account = importAccount(pk.trim());
    contract.updateAccount(account);
    state.showImport = false;
    state.error = "";
    render();
  } catch (e) {
    state.error = "Invalid private key: " + e.message;
    render();
  }
}
function disconnectWallet() { clearAccount(); account = null; contract.updateAccount(null); render(); }

async function handleSubmitTenant(text) {
  state.loading = true; state.error = ""; render();
  try { await contract.submitTenantClaim(text); await refresh(); }
  catch (e) { state.error = "Submit failed: " + e.message; }
  state.loading = false; render();
}
async function handleSubmitLandlord(text) {
  state.loading = true; state.error = ""; render();
  try { await contract.submitLandlordClaim(text); await refresh(); }
  catch (e) { state.error = "Submit failed: " + e.message; }
  state.loading = false; render();
}
async function handleResolve() {
  state.loading = true; state.error = ""; render();
  try { await contract.resolveDispute(); await refresh(); }
  catch (e) { state.error = "Resolve failed (validators may have disagreed — try again): " + e.message; }
  state.loading = false; render();
}

function renderTab() {
  const s = state.summary;
  if (state.tab === "details") {
    return `<h2>Case Overview</h2>
      <p class="muted">DepositJudge reads the lease terms and both parties' statements, then an AI validator panel reaches consensus on a fair deposit split — recorded permanently on-chain.</p>
      <div class="field-row"><span class="field-label">Status</span><span class="field-value">${s?.status ?? "…"}</span></div>
      <div class="field-row"><span class="field-label">Deposit amount</span><span class="field-value">${s?.deposit_amount ?? "…"}</span></div>
      <div class="field-row"><span class="field-label">Lease terms</span><span class="field-value">${s?.lease_terms ?? "…"}</span></div>
      <div class="field-row"><span class="field-label">Landlord</span><span class="field-value">${s ? s.landlord : "…"}</span></div>
      <div class="field-row"><span class="field-label">Tenant</span><span class="field-value">${s ? s.tenant : "…"}</span></div>
      ${s?.tenant_claim ? `<div class="claim-block"><div class="who">Tenant's statement</div><div class="text">${s.tenant_claim}</div></div>` : ""}
      ${s?.landlord_claim ? `<div class="claim-block"><div class="who">Landlord's statement</div><div class="text">${s.landlord_claim}</div></div>` : ""}
      <button id="refresh-btn" class="btn btn-secondary" style="margin-top:18px;">Refresh</button>`;
  }
  if (state.tab === "submit") {
    const tenantDone = s && s.status !== "created";
    const landlordDone = s && (s.status === "landlord_submitted" || s.status === "resolved");
    const landlordReady = s && s.status === "tenant_submitted";
    return `<h2>File a Statement</h2>
      <p class="muted">Tenant files first, then landlord. Each statement is recorded exactly as written — validators read it directly.</p>
      <div class="field-row"><span class="field-label">Tenant statement</span><span class="field-value">${tenantDone ? "✓ filed" : "not yet filed"}</span></div>
      ${!tenantDone ? `
        <textarea id="tenant-input" class="input" placeholder="Describe the property condition at move-out…"></textarea>
        <button id="tenant-btn" class="btn btn-primary btn-block" ${state.loading ? "disabled" : ""}>${state.loading ? "Filing…" : "File Tenant Statement"}</button>
      ` : ""}
      <div class="field-row" style="margin-top:22px;"><span class="field-label">Landlord statement</span><span class="field-value">${landlordDone ? "✓ filed" : "not yet filed"}</span></div>
      ${!landlordDone ? `
        <textarea id="landlord-input" class="input" placeholder="Describe damages and deductions claimed…" ${!landlordReady ? "disabled" : ""}></textarea>
        <button id="landlord-btn" class="btn btn-primary btn-block" ${state.loading || !landlordReady ? "disabled" : ""}>${state.loading ? "Filing…" : "File Landlord Statement"}</button>
        ${!landlordReady ? `<p class="hint">Waiting on the tenant's statement first.</p>` : ""}
      ` : ""}
      ${!account ? `<p class="hint">Connect a wallet above to sign your statement.</p>` : ""}`;
  }
  if (state.tab === "resolve") {
    const ready = s && s.status === "landlord_submitted";
    const done = s && s.status === "resolved";
    return `<h2>Resolve & Verdict</h2>
      <p class="muted">Once both statements are filed, request a ruling. Independent AI validators read the lease terms and both statements, then reach consensus on a fair split.</p>
      ${!done ? `
        <button id="resolve-btn" class="btn btn-primary btn-block" ${state.loading || !ready ? "disabled" : ""}>${state.loading ? "Deliberating (consensus in progress)…" : "Request Ruling"}</button>
        ${!ready ? `<p class="hint">Both statements must be filed before a ruling can be requested.</p>` : `<p class="hint">May take up to 30 seconds — multiple validators are reasoning independently.</p>`}
      ` : ""}
      ${state.verdict ? `
        <div class="verdict-box">
          <div class="verdict-label">Ruling</div>
          <div class="verdict-split">${state.verdict.tenant_pct}% to tenant</div>
          <div class="verdict-amounts">TENANT RECEIVES ${state.verdict.tenant_amount} &nbsp;·&nbsp; LANDLORD RETAINS ${state.verdict.landlord_amount}</div>
          <div class="verdict-text">“${state.verdict.reasoning}”</div>
        </div>
      ` : `<p class="hint">No ruling yet.</p>`}`;
  }
}

function render() {
  const s = state.summary;
  app.innerHTML = `
    <header class="header"><div class="header-inner">
      <div class="brand">
        <span class="brand-mark">DJ</span>
        <div class="brand-text">
          <div class="brand-eyebrow">Intelligent Contract</div>
          <div class="brand-name">DepositJudge</div>
        </div>
      </div>
      <div class="wallet">
        ${account
          ? `<div style="text-align:right;"><span class="addr">${account.address}</span> <button id="disconnect-btn" class="btn btn-ghost">Disconnect</button></div>`
          : `<button id="connect-btn" class="btn btn-primary">Connect Wallet</button><button id="import-toggle-btn" class="btn btn-secondary">Import Wallet</button>`
        }
      </div>
    </div>
    ${!account && state.showImport ? `
      <div class="import-row">
        <input id="import-pk-input" class="input" type="password" placeholder="0x… paste your private key" style="margin-bottom:0;" />
        <button id="import-confirm-btn" class="btn btn-primary">Import</button>
      </div>
    ` : ""}
    </header>
    <main class="main">
      <div class="status-banner ${badgeClass(s?.status)}">${statusLabel(s?.status)}</div>
      <nav class="tabs">
        <button data-tab="details" class="tab ${state.tab === "details" ? "tab-active" : ""}">Case Overview</button>
        <button data-tab="submit" class="tab ${state.tab === "submit" ? "tab-active" : ""}">File Statement</button>
        <button data-tab="resolve" class="tab ${state.tab === "resolve" ? "tab-active" : ""}">Resolve & Verdict</button>
      </nav>
      ${state.error ? `<div class="alert alert-error">${state.error}</div>` : ""}
      <section class="panel">${renderTab()}</section>
    </main>
    <footer class="footer">Arbitrated via Intelligent Contract on <strong>GenLayer</strong> — consensus, not a single AI call.</footer>
  `;
  document.getElementById("connect-btn")?.addEventListener("click", connectWallet);
  document.getElementById("import-toggle-btn")?.addEventListener("click", toggleImport);
  document.getElementById("import-confirm-btn")?.addEventListener("click", () => {
    const v = document.getElementById("import-pk-input").value;
    if (v.trim()) handleImportWallet(v);
  });
  document.getElementById("disconnect-btn")?.addEventListener("click", disconnectWallet);
  document.getElementById("refresh-btn")?.addEventListener("click", refresh);
  document.getElementById("resolve-btn")?.addEventListener("click", handleResolve);
  document.getElementById("tenant-btn")?.addEventListener("click", () => {
    const v = document.getElementById("tenant-input").value.trim();
    if (v) handleSubmitTenant(v);
  });
  document.getElementById("landlord-btn")?.addEventListener("click", () => {
    const v = document.getElementById("landlord-input").value.trim();
    if (v) handleSubmitLandlord(v);
  });
  document.querySelectorAll(".tab").forEach((el) => el.addEventListener("click", () => { state.tab = el.dataset.tab; render(); }));
}

try {
  render();
  refresh();
} catch (err) {
  showFatalError("App failed to start", err);
}
</script>
</body>
</html>
